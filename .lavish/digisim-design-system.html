<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiSim Design System</title>
<style>
  :root {
    --bg-dark: #0f1115;
    --bg-canvas: #15181e;
    --glass-bg: rgba(30, 34, 42, 0.65);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.5);
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --border-color: rgba(255, 255, 255, 0.1);
    --danger: #ef4444;
    --success: #10b981;
    --high-signal: #22c55e;
    --low-signal: #64748b;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Typography */
  h1, h2, h3 { margin: 0 0 1rem 0; font-weight: 600; }
  h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }

  /* Glassmorphism Mixin */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }

  /* Top Navbar */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1.5rem;
    height: 60px;
    box-sizing: border-box;
    z-index: 100;
  }

  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 700;
  }

  .brand-tag {
    font-size: 0.75rem;
    color: var(--accent);
    background: rgba(99, 102, 241, 0.1);
    padding: 0.2rem 0.5rem;
    border-radius: 9999px;
    margin-left: 0.5rem;
  }

  .navbar-status {
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .stat-chip {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.875rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .stat-chip--live {
    border-color: rgba(34, 197, 94, 0.3);
    color: var(--high-signal);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background-color: var(--high-signal);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--high-signal);
  }

  .btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.875rem;
    transition: all 0.2s;
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* Main Layout */
  .main-content {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-color);
    z-index: 10;
  }

  .sidebar-head {
    padding: 1rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
  }

  .palette-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .palette-chip {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    cursor: grab;
    transition: all 0.2s;
  }

  .palette-chip:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .chip-icon {
    font-size: 1.5rem;
  }

  /* Canvas Area */
  .canvas-area {
    flex: 1;
    background-color: var(--bg-canvas);
    position: relative;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  /* Node Components */
  .node-card {
    position: absolute;
    min-width: 120px;
    border-radius: 8px;
    padding: 0;
    overflow: hidden;
    /* This emulates the node being placed on canvas */
  }
  
  .node-header {
    background: rgba(0, 0, 0, 0.3);
    padding: 0.5rem;
    font-size: 0.75rem;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
  }

  .node-body {
    padding: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .node-gate {
    width: 60px;
    height: 40px;
  }

  .handle {
    width: 10px;
    height: 10px;
    background: var(--text-primary);
    border: 2px solid var(--bg-dark);
    border-radius: 50%;
    position: absolute;
  }
  .handle-left { left: -5px; top: 50%; transform: translateY(-50%); }
  .handle-right { right: -5px; top: 50%; transform: translateY(-50%); }

  /* Input Node */
  .node-input .node-body {
    flex-direction: column;
  }
  .switch-toggle {
    width: 40px;
    height: 20px;
    background: var(--low-signal);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
  }
  .switch-toggle::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: all 0.2s;
  }
  .node-input.active .switch-toggle { background: var(--high-signal); }
  .node-input.active .switch-toggle::after { left: 22px; }

  /* Output Node */
  .led-indicator {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--low-signal);
    border: 2px solid rgba(0,0,0,0.5);
  }
  .node-output.active .led-indicator {
    background: var(--danger);
    box-shadow: 0 0 15px var(--danger);
  }

  /* Properties Inspector */
  .inspector {
    position: absolute;
    right: 1.5rem;
    top: 1.5rem;
    width: 260px;
    border-radius: 12px;
    padding: 1rem;
    z-index: 50;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  .form-group label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-bottom: 0.5rem;
  }

  .form-group input {
    width: 100%;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 0.5rem;
    border-radius: 4px;
    box-sizing: border-box;
  }

  /* Selection Toolbar */
  .floating-toolbar {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem;
    border-radius: 9999px;
    z-index: 50;
  }
  
  .toolbar-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
  }
  .toolbar-btn:hover {
    background: rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar glass">
    <div class="navbar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M9 3v18M15 3v18" />
      </svg>
      DigiSim
      <span class="brand-tag">v2</span>
    </div>
    <div class="navbar-status">
      <div class="stat-chip">
        <span>12 Nodes</span>
      </div>
      <div class="stat-chip stat-chip--live">
        <span class="pulse-dot"></span>
        <span>Simulating</span>
      </div>
      <button class="btn btn-primary">Export</button>
    </div>
  </header>

  <!-- Main Area -->
  <div class="main-content">
    
    <!-- Sidebar -->
    <aside class="sidebar glass">
      <div class="sidebar-head">
        <h2>Toolbox</h2>
        <button class="btn">☰</button>
      </div>
      <div class="sidebar-body">
        
        <h3>I/O</h3>
        <div class="palette-grid">
          <div class="palette-chip">
            <span class="chip-icon">⏻</span>
            <span>Input</span>
          </div>
          <div class="palette-chip">
            <span class="chip-icon">◗</span>
            <span>Output</span>
          </div>
        </div>

        <h3>Component Library</h3>
        <div class="palette-grid">
          <!-- Logic Gates Category -->
          <div class="palette-chip">
            <svg width="32" height="32" viewBox="0 0 40 40" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M10 10 L20 10 C 30 10, 30 30, 20 30 L10 30 Z" />
            </svg>
            <span>AND</span>
          </div>
          <div class="palette-chip">
            <svg width="32" height="32" viewBox="0 0 40 40" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M10 10 C 20 10, 30 20, 30 20 C 30 20, 20 30, 10 30 C 15 20, 15 20, 10 10" />
            </svg>
            <span>OR</span>
          </div>
          <div class="palette-chip">
            <svg width="32" height="32" viewBox="0 0 40 40" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M10 10 L20 20 L10 30 Z" />
              <circle cx="23" cy="20" r="3" />
            </svg>
            <span>NOT</span>
          </div>
          <div class="palette-chip">
            <svg width="32" height="32" viewBox="0 0 40 40" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M5 10 C 10 20, 10 20, 5 30" />
              <path d="M10 10 C 20 10, 30 20, 30 20 C 30 20, 20 30, 10 30 C 15 20, 15 20, 10 10" />
            </svg>
            <span>XOR</span>
          </div>
        </div>

      </div>
    </aside>

    <!-- Canvas -->
    <main class="canvas-area">
      
      <!-- Nodes (Mockup) -->
      
      <!-- Input 1 -->
      <div class="node-card glass node-input active" style="left: 100px; top: 150px;">
        <div class="node-header">Input A</div>
        <div class="node-body">
          <div class="switch-toggle"></div>
        </div>
        <div class="handle handle-right"></div>
      </div>

      <!-- Input 2 -->
      <div class="node-card glass node-input" style="left: 100px; top: 300px;">
        <div class="node-header">Input B</div>
        <div class="node-body">
          <div class="switch-toggle"></div>
        </div>
        <div class="handle handle-right"></div>
      </div>

      <!-- AND Gate -->
      <div class="node-card glass" style="left: 350px; top: 225px;">
        <div class="node-header">AND</div>
        <div class="node-body">
          <svg class="node-gate" viewBox="0 0 40 40" stroke="currentColor" fill="none" stroke-width="2">
            <path d="M5 5 L20 5 C 35 5, 35 35, 20 35 L5 35 Z" />
          </svg>
        </div>
        <div class="handle handle-left" style="top: 30%;"></div>
        <div class="handle handle-left" style="top: 70%;"></div>
        <div class="handle handle-right"></div>
      </div>

      <!-- Output -->
      <div class="node-card glass node-output active" style="left: 600px; top: 225px;">
        <div class="node-header">Output</div>
        <div class="node-body">
          <div class="led-indicator"></div>
        </div>
        <div class="handle handle-left"></div>
      </div>

      <!-- Mock wires using SVG -->
      <svg style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 0;">
        <!-- High signal wire -->
        <path d="M220 180 C 280 180, 280 237, 345 237" fill="none" stroke="var(--high-signal)" stroke-width="3" />
        <!-- Low signal wire -->
        <path d="M220 330 C 280 330, 280 253, 345 253" fill="none" stroke="var(--low-signal)" stroke-width="3" />
        <!-- Output wire -->
        <path d="M470 245 L 595 245" fill="none" stroke="var(--low-signal)" stroke-width="3" />
      </svg>

      <!-- Inspector Panel -->
      <div class="inspector glass">
        <h3>Properties</h3>
        <div class="form-group" style="margin-top: 1rem;">
          <label>Label</label>
          <input type="text" value="AND Gate">
        </div>
        <div class="form-group">
          <label>Delay (ms)</label>
          <input type="number" value="10">
        </div>
        <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; background: var(--danger); border-color: var(--danger);">Delete Node</button>
      </div>

      <!-- Floating Toolbar -->
      <div class="floating-toolbar glass">
        <button class="toolbar-btn" title="Select">↖</button>
        <button class="toolbar-btn" title="Pan">✋</button>
        <div style="width: 1px; background: var(--border-color); margin: 0 4px;"></div>
        <button class="toolbar-btn" title="Zoom In">⊕</button>
        <button class="toolbar-btn" title="Zoom Out">⊖</button>
        <button class="toolbar-btn" title="Fit View">⛶</button>
      </div>

    </main>

  </div>

</body>
</html>
