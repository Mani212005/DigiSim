<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiSim Design System & Layout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playwrite+ID:wght@100..400&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      --main-bg: #396D62;
      --sub-bg: #9BA571;
      --highlight: #FCDD7F;
      --font-regular: 'STIX Two Text', Georgia, serif;
      --font-cursive: 'Playwrite ID', cursive;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

      --bg: var(--main-bg);
      --panel: var(--sub-bg);
      --border: rgba(0, 0, 0, 0.15);
      --border-bright: var(--highlight);
      --accent: var(--highlight);
      --signal: #10b981;
      --text: #f8fafc;
      --text-panel: #1e293b;
      --muted: rgba(15, 23, 42, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-regular);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 1.25rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      color: var(--text-panel);
      z-index: 30;
    }
    
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-panel);
    }
    
    .brand-name {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
    }
    
    .brand-tag {
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-panel);
      opacity: 0.8;
      border-left: 1px solid var(--border);
      padding-left: 0.6rem;
    }

    .navbar-status {
      display: flex;
      gap: 0.5rem;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-panel);
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      cursor: pointer;
    }
    .stat-value {
      font-weight: 700;
    }

    /* Layout Shell */
    .content-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: linear-gradient(135deg, rgba(155, 165, 113, 0.95), rgba(135, 145, 93, 0.95));
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      color: var(--text-panel);
      box-shadow: 2px 0 15px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }
    
    /* Fun subtle pattern behind sidebar */
    .sidebar::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 2px, transparent 2px);
      background-size: 20px 20px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    .sidebar > * {
      position: relative;
      z-index: 1;
    }
    
    .sidebar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #111827;
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
      overflow-y: auto;
    }

    .sidebar-menu-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
      padding: 1rem 1.25rem;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.15);
      text-align: left;
      cursor: pointer;
      border-radius: 12px;
      color: var(--text-panel);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    .sidebar-menu-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.1);
    }
    .sidebar-menu-btn:active {
      transform: translateY(0);
    }
    .sidebar-menu-btn__name {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f172a;
    }
    .sidebar-menu-btn__sub {
      display: block;
      font-size: 0.75rem;
      opacity: 0.8;
      color: #334155;
    }

    /* Canvas Area */
    .canvas-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
    }

    .reactflow-wrapper {
      flex: 1;
      position: relative;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Dummy nodes for visual mock */
    .dummy-node {
      position: absolute;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px 12px;
      color: #f8fafc;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 80px;
    }

    /* Terminal/Netlist Mock */
    .terminal-panel {
      height: 180px;
      background: linear-gradient(to top, rgba(155, 165, 113, 0.95), rgba(155, 165, 113, 0.85));
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      color: var(--text-panel);
      display: flex;
      flex-direction: column;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.15);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      margin: 0 1rem; /* Give it some spacing so it feels like a distinct floating panel */
      overflow: hidden;
      position: relative;
    }
    .terminal-header {
      padding: 0.75rem 1.25rem;
      background: rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .terminal-content {
      padding: 1rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.05);
      flex: 1;
      color: #1e293b;
      line-height: 1.5;
    }
    .terminal-content span.highlight {
      color: var(--main-bg);
      font-weight: bold;
    }

  </style>
</head>
<body>

  <div class="navbar">
    <div class="navbar-brand">
      <span class="brand-name">DigiSim</span>
      <span class="brand-tag">Circuit Analyzer</span>
    </div>
    <div class="navbar-status">
      <button class="stat-chip"><span class="stat-value">5</span> components</button>
      <button class="stat-chip"><span class="stat-value">4</span> wires</button>
      <button class="stat-chip">🗀 Projects</button>
      <button class="stat-chip">⌘ Terminal</button>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="sidebar">
      <div class="sidebar-head">
        <span>Toolbox</span>
        <span>☰</span>
      </div>
      <div class="sidebar-menu">
        <button class="sidebar-menu-btn">
          <span class="sidebar-menu-btn__name">Logic Gates</span>
          <span class="sidebar-menu-btn__sub">inputs, outputs & 7 gate types</span>
        </button>
        <button class="sidebar-menu-btn">
          <span class="sidebar-menu-btn__name">Analog Parts</span>
          <span class="sidebar-menu-btn__sub">sources, resistors, LEDs & more</span>
        </button>
        <button class="sidebar-menu-btn">
          <span class="sidebar-menu-btn__name">Vision</span>
          <span class="sidebar-menu-btn__sub">detect circuits from photos</span>
        </button>
      </div>
    </div>

    <div class="canvas-column">
      <div class="reactflow-wrapper">
        <div class="dummy-node" style="top: 100px; left: 150px;">Input A</div>
        <div class="dummy-node" style="top: 150px; left: 150px;">Input B</div>
        <div class="dummy-node" style="top: 125px; left: 350px;">AND Gate</div>
        <div class="dummy-node" style="top: 125px; left: 550px;">Output</div>
        
        <svg style="position:absolute; inset:0; pointer-events:none; width:100%; height:100%;">
          <path d="M 230 115 C 290 115, 290 135, 350 135" stroke="var(--highlight)" stroke-width="2" fill="none" />
          <path d="M 230 165 C 290 165, 290 145, 350 145" stroke="var(--highlight)" stroke-width="2" fill="none" />
          <path d="M 430 140 C 490 140, 490 140, 550 140" stroke="var(--highlight)" stroke-width="2" fill="none" />
        </svg>
      </div>
      
      <div class="terminal-panel">
        <div class="terminal-header">Terminal / Truth Table</div>
        <div class="terminal-content">
          <span class="highlight">A | B | OUT</span><br>
          0 | 0 | 0<br>
          0 | 1 | 0<br>
          1 | 0 | 0<br>
          <span class="highlight">1 | 1 | 1</span><br>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
