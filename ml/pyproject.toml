[project]
name = "digisim-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.1",
    "scipy>=1.11",
    "huggingface_hub>=0.24",
    "onnx>=1.16",
    "onnxslim>=0.1.34",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["smoke: end-to-end CPU training run (needs network for pretrained weights; enable with DIGISIM_ML_SMOKE=1)"]
