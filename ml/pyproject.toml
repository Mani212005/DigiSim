[project]
name = "digisim-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
